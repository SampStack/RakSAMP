name: Build and publish releases

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      release_version:
        description: Optional immutable release tag (for example v0.9.4)
        required: false
        default: ""
        type: string
      push_dev:
        description: Also update the mutable dev release and container tags
        required: true
        default: true
        type: boolean
      native_consumers_green:
        description: Confirm consuming gamemodes passed native validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - name: Pin source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ inputs.push_dev }}
          CONSUMERS_GREEN: ${{ inputs.native_consumers_green }}
        run: |
          if [[ "$CONSUMERS_GREEN" != "true" ]]; then
            echo "::error::Consuming gamemodes must pass native validation before publication."
            exit 1
          fi
          if [[ -z "$RELEASE_TAG" && "$PUSH_DEV" != "true" ]]; then
            echo "::error::Set a release version or enable Push to dev."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
            [[ "$RELEASE_TAG" != "dev" ]]
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate samples
        run: |
          build/bin/raksamp-client --config client/bin/RakSAMPClient.xml --check-config
          build/bin/raksamp-server --config server/bin/RakSAMPServer.xml --check-config

  native-build:
    needs: validate
    uses: ./.github/workflows/native-build.yml
    with:
      source_ref: ${{ needs.validate.outputs.revision }}

  ghcr-publish:
    name: Publish ${{ matrix.product }} container tags
    needs: [validate, native-build]
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    strategy:
      fail-fast: false
      matrix:
        product: [client, server]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sampstack/raksamp-${{ matrix.product }}
          tags: |
            type=raw,value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=raw,value=dev,enable=${{ inputs.push_dev }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
      - name: Build once and publish selected tags
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.product }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.product }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}

  release-publish:
    name: Publish native release
    needs: [validate, native-build, ghcr-publish]
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Publish selected releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ inputs.push_dev }}
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          (cd native-dist && sha256sum * > SHA256SUMS)

          if [[ -n "$RELEASE_TAG" ]]; then
            previous_tag=$(git describe --tags --abbrev=0 --exclude=dev "$revision^")
            generated_notes=$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$revision" \
              -f previous_tag_name="$previous_tag" \
              --jq .body)
            notes_file="$RUNNER_TEMP/release-notes.md"
            {
              printf '# RakSAMP %s\n\n' "$RELEASE_TAG"
              printf 'Built once from commit [`%s`](%s/%s/commit/%s).\n\n' \
                "$revision" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$revision"
              printf '## Compatibility\n\n'
              printf -- '- SA-MP 0.3.7 and 0.3DL protocols\n'
              printf -- '- Native packages for Linux x64/arm64, Windows x64, and macOS x64/arm64\n'
              printf -- '- Client and server containers for linux/amd64\n\n'
              printf '## Changes since %s\n\n%s\n\n' "$previous_tag" "$generated_notes"
              printf '**Full comparison:** %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            } > "$notes_file"

            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
            git tag "$RELEASE_TAG" "$revision"
            git push origin "refs/tags/$RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "RakSAMP $RELEASE_TAG" \
              --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" native-dist/*
          fi

          if [[ "$PUSH_DEV" == "true" ]]; then
            git tag --force dev "$revision"
            git push origin refs/tags/dev --force
            if gh release view dev >/dev/null 2>&1; then
              gh release edit dev \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced only by a manual workflow run."
            else
              gh release create dev \
                --target "$revision" \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced only by a manual workflow run."
            fi
            gh release delete-asset dev raksamp-client-windows-arm64.zip --yes 2>/dev/null || true
            gh release delete-asset dev raksamp-server-windows-arm64.zip --yes 2>/dev/null || true
            gh release upload dev native-dist/* --clobber
          fi
