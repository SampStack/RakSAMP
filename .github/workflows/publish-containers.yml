name: Build and publish containers

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      image_tag:
        description: Container tag (dev is mutable)
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate samples
        run: |
          build/bin/raksamp-client --config client/bin/RakSAMPClient.xml --check-config
          build/bin/raksamp-server --config server/bin/RakSAMPServer.xml --check-config

  ghcr-publish:
    name: Publish ${{ matrix.product }}
    needs: validate
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    strategy:
      fail-fast: false
      matrix:
        product: [client, server]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Resolve revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.product }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/sampstack/raksamp-${{ matrix.product }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.product }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}
