name: Build and publish releases

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      release_version:
        description: Optional immutable release tag (for example v0.9.4)
        required: false
        default: ""
        type: string
      push_dev:
        description: Also update the mutable dev release and container tags
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ inputs.push_dev }}
        run: |
          if [[ -z "$RELEASE_TAG" && "$PUSH_DEV" != "true" ]]; then
            echo "::error::Set a release version or enable Push to dev."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
            [[ "$RELEASE_TAG" != "dev" ]]
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate samples
        run: |
          build/bin/raksamp-client --config client/bin/RakSAMPClient.xml --check-config
          build/bin/raksamp-server --config server/bin/RakSAMPServer.xml --check-config

  native-build:
    name: Native ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            extension: tar.gz
            cmake_args: ""
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            extension: tar.gz
            cmake_args: ""
          - platform: windows
            arch: x64
            runner: windows-2025
            extension: zip
            cmake_args: ""
          - platform: windows
            arch: arm64
            runner: windows-11-arm
            extension: zip
            cmake_args: ""
          - platform: macos
            arch: x64
            runner: macos-15-intel
            extension: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - platform: macos
            arch: arm64
            runner: macos-15
            extension: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage packages
        shell: bash
        run: |
          cmake --install build --config Release --prefix package/raksamp-client --component client
          cmake --install build --config Release --prefix package/raksamp-server --component server
          executable_suffix=""
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            executable_suffix=".exe"
          fi
          "package/raksamp-client/raksamp-client${executable_suffix}" --version
          "package/raksamp-server/raksamp-server${executable_suffix}" --version
      - name: Create archives
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p native-dist
          for product in client server; do
            archive="raksamp-${product}-${PLATFORM}-${ARCH}.${EXTENSION}"
            if [[ "$EXTENSION" == "zip" ]]; then
              (cd package && cmake -E tar cf "../native-dist/$archive" --format=zip -- "raksamp-${product}")
            else
              (cd package && cmake -E tar czf "../native-dist/$archive" -- "raksamp-${product}")
            fi
          done
      - name: Upload native archives
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: 30

  ghcr-publish:
    name: Publish ${{ matrix.product }} container tags
    needs: validate
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    strategy:
      fail-fast: false
      matrix:
        product: [client, server]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - name: Resolve revision
        id: source
        shell: bash
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sampstack/raksamp-${{ matrix.product }}
          tags: |
            type=raw,value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=raw,value=dev,enable=${{ inputs.push_dev }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
      - name: Build once and publish selected tags
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.product }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.product }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}

  release-publish:
    name: Publish native release
    needs: [native-build, ghcr-publish]
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
      - name: Publish selected releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ inputs.push_dev }}
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          (cd native-dist && sha256sum * > SHA256SUMS)

          if [[ -n "$RELEASE_TAG" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
            git tag "$RELEASE_TAG" "$revision"
            git push origin "refs/tags/$RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "RakSAMP $RELEASE_TAG" \
              --generate-notes
            gh release upload "$RELEASE_TAG" native-dist/*
          fi

          if [[ "$PUSH_DEV" == "true" ]]; then
            git tag --force dev "$revision"
            git push origin refs/tags/dev --force
            if gh release view dev >/dev/null 2>&1; then
              gh release edit dev \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced only by a manual workflow run."
            else
              gh release create dev \
                --target "$revision" \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced only by a manual workflow run."
            fi
            gh release upload dev native-dist/* --clobber
          fi
