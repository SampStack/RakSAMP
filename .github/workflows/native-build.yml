name: Native build

on:
  workflow_call:
    inputs:
      source_ref:
        description: Commit, branch, or tag to build
        required: true
        type: string
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/native-build.yml
      - CMakeLists.txt
      - "**/*.cmake"
      - client/**
      - server/**
      - common/**
      - tests/**
      - packaging/**

permissions:
  contents: read

jobs:
  build:
    name: Native ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            extension: tar.gz
            cmake_args: ""
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            extension: tar.gz
            cmake_args: ""
          - platform: windows
            arch: x64
            runner: windows-2025
            extension: zip
            cmake_args: ""
          - platform: macos
            arch: x64
            runner: macos-15-intel
            extension: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          - platform: macos
            arch: arm64
            runner: macos-15
            extension: tar.gz
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          clean: true
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Validate sample configurations
        if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          build/bin/raksamp-client --config client/bin/RakSAMPClient.xml --check-config
          build/bin/raksamp-server --config server/bin/RakSAMPServer.xml --check-config
      - name: Stage packages
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cmake --install build --config Release --prefix package/raksamp-client --component client
          cmake --install build --config Release --prefix package/raksamp-server --component server
          executable_suffix=""
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            executable_suffix=".exe"
          fi
          "package/raksamp-client/raksamp-client${executable_suffix}" --version
          "package/raksamp-server/raksamp-server${executable_suffix}" --version
          if [[ "$PLATFORM" == macos ]]; then
            for product in client server; do
              package_dir="package/raksamp-$product"
              executable="$package_dir/raksamp-$product"
              codesign --force --sign - --timestamp=none "$executable"
              codesign --verify --strict "$executable"
              cp packaging/authorize-macos-runtime.sh "$package_dir/"
              chmod +x "$package_dir/authorize-macos-runtime.sh"
              (cd "$package_dir" && shasum -a 256 "raksamp-$product" > macos-runtime.sha256)
            done
          fi
      - name: Create archives
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          mkdir -p native-dist
          for product in client server; do
            archive="raksamp-${product}-${PLATFORM}-${ARCH}.${EXTENSION}"
            if [[ "$EXTENSION" == "zip" ]]; then
              (cd package && cmake -E tar cf "../native-dist/$archive" --format=zip -- "raksamp-${product}")
            else
              (cd package && cmake -E tar czf "../native-dist/$archive" -- "raksamp-${product}")
            fi
          done
      - name: Upload native archives
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: native-dist/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 30 }}
