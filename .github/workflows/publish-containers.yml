name: Build and publish releases

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: master
        type: string
      release_version:
        description: Optional immutable release tag (for example 0.10.0)
        required: false
        default: ""
        type: string
      push_dev:
        description: Also update the mutable dev release and container tags
        required: true
        default: true
        type: boolean
      build_only:
        description: Build and retain artifacts without publishing
        required: true
        default: false
        type: boolean
      artifact_run_id:
        description: Reuse artifacts from a successful prior run; skips all native builds
        required: false
        default: ""
        type: string
      native_consumers_green:
        description: Confirm consuming gamemodes passed validation before an immutable release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: publish-raksamp
  cancel-in-progress: false

jobs:
  validate:
    name: Validate client and server
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      publish_dev: ${{ steps.source.outputs.publish_dev }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - name: Pin source revision
        id: source
        env:
          PUSH_DEV: ${{ inputs.push_dev }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish_dev=$PUSH_DEV" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ inputs.push_dev }}
          BUILD_ONLY: ${{ inputs.build_only }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          CONSUMERS_GREEN: ${{ inputs.native_consumers_green }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$BUILD_ONLY" != true ]]
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ARTIFACT_RUN_ID")
            [[ "$(jq -r .conclusion <<<"$prior")" == success ]]
            [[ "$(jq -r .head_sha <<<"$prior")" == "$(git rev-parse HEAD)" ]]
            [[ "$(jq -r .path <<<"$prior")" == ".github/workflows/publish-containers.yml" ]]
          fi
          if [[ "$BUILD_ONLY" != true && -z "$RELEASE_TAG" && "$PUSH_DEV" != "true" ]]; then
            echo "::error::Enable mutable dev, provide a release version, or select build-only."
            exit 1
          fi
          if [[ "$BUILD_ONLY" != true && -n "$RELEASE_TAG" && "$CONSUMERS_GREEN" != "true" ]]; then
            echo "::error::Consuming gamemodes must pass native validation before publication."
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]
            [[ "$RELEASE_TAG" != "dev" ]]
            git check-ref-format "refs/tags/$RELEASE_TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
          fi
  native-build:
    needs: validate
    if: inputs.artifact_run_id == ''
    uses: ./.github/workflows/native-build.yml
    with:
      source_ref: ${{ needs.validate.outputs.revision }}

  ghcr-publish:
    name: Publish ${{ matrix.product }} container tags
    needs: [validate, native-build]
    if: >-
      always() && needs.validate.result == 'success' && !inputs.build_only &&
      (inputs.release_version != '' || needs.validate.outputs.publish_dev == 'true') &&
      (inputs.artifact_run_id != '' || needs.native-build.result == 'success')
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    strategy:
      fail-fast: false
      matrix:
        product: [client, server]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
      - uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native-dist
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Stage prebuilt ${{ matrix.product }} image context
        shell: bash
        run: |
          mkdir -p container-context
          tar -xzf "native-dist/raksamp-${{ matrix.product }}-linux-x64.tar.gz" \
            --strip-components=1 -C container-context
          mv "container-context/raksamp-${{ matrix.product }}" container-context/raksamp
          if [[ "${{ matrix.product }}" == client ]]; then
            cp container-context/RakSAMPClient.xml container-context/default-config.xml
          else
            cp container-context/RakSAMPServer.xml container-context/default-config.xml
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sampstack/raksamp-${{ matrix.product }}
          tags: |
            type=raw,value=${{ inputs.release_version }},enable=${{ inputs.release_version != '' }}
            type=raw,value=dev,enable=${{ needs.validate.outputs.publish_dev == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
      - name: Build once and publish selected tags
        uses: docker/build-push-action@v7
        with:
          context: container-context
          file: ${{ github.workspace }}/packaging/Dockerfile.runtime.amd64
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: PRODUCT=${{ matrix.product }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.product }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product }}

  release-publish:
    name: Publish native release
    needs: [validate, native-build, ghcr-publish]
    if: >-
      always() && needs.validate.result == 'success' && needs.ghcr-publish.result == 'success' &&
      !inputs.build_only && (inputs.release_version != '' || needs.validate.outputs.publish_dev == 'true')
    runs-on: ubuntu-24.04
    environment: ghcr-publish
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.revision }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native-dist
          merge-multiple: true
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Publish selected releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_version }}
          PUSH_DEV: ${{ needs.validate.outputs.publish_dev }}
        shell: bash
        run: |
          revision=$(git rev-parse HEAD)
          (cd native-dist && sha256sum * > SHA256SUMS)

          if [[ -n "$RELEASE_TAG" ]]; then
            previous_tag=$(git describe --tags --abbrev=0 --exclude=dev "$revision^")
            generated_notes=$(gh api --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$revision" \
              -f previous_tag_name="$previous_tag" \
              --jq .body)
            notes_file="$RUNNER_TEMP/release-notes.md"
            {
              printf '# RakSAMP %s\n\n' "$RELEASE_TAG"
              printf 'Built once from commit [`%s`](%s/%s/commit/%s).\n\n' \
                "$revision" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$revision"
              printf '## Compatibility\n\n'
              printf -- '- SA-MP 0.3.7 and 0.3DL protocols\n'
              printf -- '- Native packages for Linux x64/arm64, Windows x64, and macOS x64/arm64\n'
              printf -- '- Client and server containers for linux/amd64\n\n'
              printf '**Development status:** This release is actively developed; behavior and packaging may change before a future stability declaration.\n\n'
              printf '## Changes since %s\n\n%s\n\n' "$previous_tag" "$generated_notes"
              printf '**Full comparison:** %s/%s/compare/%s...%s\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
            } > "$notes_file"

            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Release tag $RELEASE_TAG already exists; versioned releases are immutable."
              exit 1
            fi
            git tag "$RELEASE_TAG" "$revision"
            git push origin "refs/tags/$RELEASE_TAG"
            prerelease=()
            [[ "$RELEASE_TAG" != *-* ]] || prerelease+=(--prerelease)
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              "${prerelease[@]}" \
              --title "RakSAMP $RELEASE_TAG" \
              --notes-file "$notes_file"
            gh release upload "$RELEASE_TAG" native-dist/*
          fi

          if [[ "$PUSH_DEV" == "true" ]]; then
            git tag --force dev "$revision"
            git push origin refs/tags/dev --force
            if gh release view dev >/dev/null 2>&1; then
              gh release edit dev \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced by the next successful manual dev refresh."
            else
              gh release create dev \
                --target "$revision" \
                --title "RakSAMP development build" \
                --prerelease \
                --notes "Rolling development build from \`$revision\`. Replaced by the next successful manual dev refresh."
            fi
            gh release view dev --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              [[ -z "$asset" ]] || gh release delete-asset dev "$asset" --yes
            done
            gh release upload dev native-dist/* --clobber
          fi
